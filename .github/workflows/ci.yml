name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic fastapi uvicorn httpx pytest
      - name: Tests that do not download models
        run: python -m pytest tests/test_dataset.py tests/test_api.py
