# CPU / CI smoke. Proves the trainer, PEFT wrap, eval, and API wire together.
# Quality numbers from this config are not portfolio results.
model_name: sshleifer/tiny-gpt2
output_dir: outputs/smoke-tiny-gpt2
max_seq_length: 128
seed: 7

lora:
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules:
    - c_attn

training:
  epochs: 1
  max_steps: 8
  learning_rate: 5.0e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  warmup_ratio: 0.0
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  eval_steps: 8
  save_steps: 8
  gradient_checkpointing: false
  packing: false
  lr_scheduler_type: constant
  load_in_4bit: false
  mixed_precision: fp32

data:
  train: data/processed/train.jsonl
  val: data/processed/val.jsonl
