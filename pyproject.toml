[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-llm"
version = "0.1.0"
description = "End-to-end LoRA fine-tune, eval, AWQ quantisation, and vLLM/FastAPI serving for a domain support model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iqbalez" }]
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "datasets>=3.0",
  "transformers>=4.45",
  "accelerate>=1.0",
  "peft>=0.13",
  "trl>=0.12",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "protobuf>=5.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = [
  "bitsandbytes>=0.44",
  "autoawq>=0.2",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
nimbus-llm = "nimbus_llm.cli:main"

[tool.setuptools.packages.find]
include = ["nimbus_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
